name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, format (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (8 / 9 / 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  pack-sbom:
    name: Pack + SBOM
    runs-on: ubuntu-latest
    needs: build-test
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack (Release)
        run: dotnet pack src/PostQuantum.Configuration/PostQuantum.Configuration.csproj -c Release -o artifacts

      - name: Generate SBOM
        run: ./build/generate-sbom.sh

      - name: Upload package + SBOM
        uses: actions/upload-artifact@v4
        with:
          name: package-and-sbom
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            sbom/*.json
